<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Univers Parfum</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #211326, #70445f);
        }

        .login-container {
            width: 380px;
            max-width: calc(100% - 30px);
            padding: 40px 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,.25);
        }

        h1 {
            text-align: center;
            color: #43243c;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #70445f;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #70445f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #43243c;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            color: #c0392b;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Univers Parfum</h1>
        <p class="subtitle">Connectez-vous à votre espace</p>

        <form id="loginForm">

            <label for="email">Adresse e-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Votre adresse e-mail"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
            >

            <button type="submit" id="loginButton">
                Se connecter
            </button>

            <p id="message"></p>

        </form>
    </div>

    <script>
        // Chaîne vide : l'API sert cette page, donc même origine (pas de CORS).
        const API_URL = "";

        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Connexion...";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch(`${API_URL}/api/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        motDePasse: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Email ou mot de passe incorrect."
                    );
                }

                // Le token et le rôle sont fournis par le backend.
                sessionStorage.setItem("token", data.token);
                sessionStorage.setItem("role", data.role);

                switch (data.role) {
                    case "ADMINISTRATEUR":
                        window.location.href = "admin.html";
                        break;
                    case "PREPARATEUR":
                        window.location.href = "preparateur.html";
                        break;
                    case "LIVREUR":
                        window.location.href = "livreur.html";
                        break;
                    case "CLIENT":
                        window.location.href = "client.html";
                        break;
                    default:
                        throw new Error("Rôle utilisateur non reconnu.");
                }

            } catch (error) {
                message.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Se connecter";
            }
        });
    </script>

</body>
</html>
