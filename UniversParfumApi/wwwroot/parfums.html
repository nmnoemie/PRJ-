<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parfums - Univers Parfum</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f2f4;
            color: #333;
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #43243c;
        }

        a.retour {
            color: #70445f;
            text-decoration: none;
            font-weight: bold;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            font-size: 18px;
            color: #43243c;
            margin-bottom: 18px;
        }

        .grille {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        input:read-only {
            background: #f0f0f0;
        }

        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 16px;
            background: #70445f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #43243c;
        }

        button.secondaire {
            background: #999;
        }

        button.danger {
            background: #c0392b;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            color: #c0392b;
        }

        #message.succes {
            color: #27ae60;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            color: #43243c;
            background: #f8f4f7;
        }

        td.vide {
            text-align: center;
            color: #777;
        }

        .petit {
            padding: 6px 10px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Gestion des parfums</h1>
        <a class="retour" href="admin.html">← Retour au tableau de bord</a>
    </header>

    <section class="card">
        <h2 id="titreFormulaire">Ajouter un parfum</h2>

        <form id="parfumForm">
            <div class="grille">
                <div>
                    <label for="reference">Référence</label>
                    <input type="text" id="reference" required>
                </div>
                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" required>
                </div>
                <div>
                    <label for="marque">Marque</label>
                    <input type="text" id="marque" required>
                </div>
                <div>
                    <label for="contenance">Contenance (ml)</label>
                    <input type="number" id="contenance" min="1" required>
                </div>
                <div>
                    <label for="prix">Prix (€)</label>
                    <input type="number" id="prix" min="0" step="0.01" required>
                </div>
                <div>
                    <label for="stock">Stock disponible</label>
                    <input type="number" id="stock" min="0" required>
                </div>
            </div>

            <div class="actions">
                <button type="submit" id="submitButton">Ajouter</button>
                <button type="button" id="annulerButton" class="secondaire" hidden>Annuler</button>
            </div>

            <p id="message"></p>
        </form>
    </section>

    <section class="card">
        <h2>Liste des parfums</h2>

        <table>
            <thead>
                <tr>
                    <th>Référence</th>
                    <th>Nom</th>
                    <th>Marque</th>
                    <th>Contenance</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableau"></tbody>
        </table>
    </section>

    <script>
        // Vérification de la session : même logique que admin.html
        const token = sessionStorage.getItem("token");
        const role = sessionStorage.getItem("role");

        if (!token || role !== "ADMINISTRATEUR") {
            window.location.href = "login.html";
        }

        const API = "/api/parfums";

        const form = document.getElementById("parfumForm");
        const message = document.getElementById("message");
        const tableau = document.getElementById("tableau");
        const submitButton = document.getElementById("submitButton");
        const annulerButton = document.getElementById("annulerButton");
        const titre = document.getElementById("titreFormulaire");
        const referenceInput = document.getElementById("reference");

        // Référence du parfum en cours de modification (null = ajout)
        let referenceEnEdition = null;

        // Envoie une requête avec le token. Si la session n'est plus valable, retour à la connexion.
        async function appeler(url, options = {}) {
            const reponse = await fetch(url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                }
            });

            if (reponse.status === 401 || reponse.status === 403) {
                sessionStorage.clear();
                window.location.href = "login.html";
                throw new Error("Session expirée.");
            }

            return reponse;
        }

        function afficherMessage(texte, succes = false) {
            message.textContent = texte;
            message.className = succes ? "succes" : "";
        }

        function creerCellule(texte) {
            const td = document.createElement("td");
            td.textContent = texte;
            return td;
        }

        async function chargerParfums() {
            const reponse = await appeler(API);
            const parfums = await reponse.json();

            tableau.innerHTML = "";

            if (parfums.length === 0) {
                const tr = document.createElement("tr");
                const td = document.createElement("td");
                td.colSpan = 7;
                td.className = "vide";
                td.textContent = "Aucun parfum pour le moment.";
                tr.appendChild(td);
                tableau.appendChild(tr);
                return;
            }

            parfums.forEach(p => {
                const tr = document.createElement("tr");

                tr.appendChild(creerCellule(p.reference));
                tr.appendChild(creerCellule(p.nom));
                tr.appendChild(creerCellule(p.marque));
                tr.appendChild(creerCellule(`${p.contenanceMl} ml`));
                tr.appendChild(creerCellule(`${p.prix} €`));
                tr.appendChild(creerCellule(p.stockDisponible));

                const actions = document.createElement("td");

                const boutonModifier = document.createElement("button");
                boutonModifier.textContent = "Modifier";
                boutonModifier.className = "petit";
                boutonModifier.addEventListener("click", () => preparerModification(p));

                const boutonSupprimer = document.createElement("button");
                boutonSupprimer.textContent = "Supprimer";
                boutonSupprimer.className = "petit danger";
                boutonSupprimer.style.marginLeft = "6px";
                boutonSupprimer.addEventListener("click", () => supprimerParfum(p.reference));

                actions.appendChild(boutonModifier);
                actions.appendChild(boutonSupprimer);
                tr.appendChild(actions);

                tableau.appendChild(tr);
            });
        }

        function preparerModification(p) {
            referenceEnEdition = p.reference;

            referenceInput.value = p.reference;
            referenceInput.readOnly = true;
            document.getElementById("nom").value = p.nom;
            document.getElementById("marque").value = p.marque;
            document.getElementById("contenance").value = p.contenanceMl;
            document.getElementById("prix").value = p.prix;
            document.getElementById("stock").value = p.stockDisponible;

            titre.textContent = "Modifier le parfum";
            submitButton.textContent = "Enregistrer";
            annulerButton.hidden = false;
            afficherMessage("");

            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function reinitialiserFormulaire() {
            referenceEnEdition = null;
            form.reset();
            referenceInput.readOnly = false;
            titre.textContent = "Ajouter un parfum";
            submitButton.textContent = "Ajouter";
            annulerButton.hidden = true;
        }

        annulerButton.addEventListener("click", () => {
            reinitialiserFormulaire();
            afficherMessage("");
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const donnees = {
                reference: referenceInput.value.trim(),
                nom: document.getElementById("nom").value.trim(),
                marque: document.getElementById("marque").value.trim(),
                contenanceMl: Number(document.getElementById("contenance").value),
                prix: Number(document.getElementById("prix").value),
                stockDisponible: Number(document.getElementById("stock").value)
            };

            try {
                let reponse;

                if (referenceEnEdition === null) {
                    reponse = await appeler(API, {
                        method: "POST",
                        body: JSON.stringify(donnees)
                    });
                } else {
                    reponse = await appeler(`${API}/${encodeURIComponent(referenceEnEdition)}`, {
                        method: "PUT",
                        body: JSON.stringify(donnees)
                    });
                }

                if (!reponse.ok) {
                    const erreur = await reponse.json().catch(() => ({}));
                    throw new Error(erreur.message || "Données invalides ou erreur serveur.");
                }

                afficherMessage(
                    referenceEnEdition === null ? "Parfum ajouté." : "Parfum modifié.",
                    true
                );

                reinitialiserFormulaire();
                await chargerParfums();

            } catch (error) {
                afficherMessage(error.message);
            }
        });

        async function supprimerParfum(reference) {
            if (!confirm(`Supprimer le parfum ${reference} ?`)) return;

            try {
                const reponse = await appeler(`${API}/${encodeURIComponent(reference)}`, {
                    method: "DELETE"
                });

                if (!reponse.ok) {
                    throw new Error("Suppression impossible.");
                }

                afficherMessage("Parfum supprimé.", true);
                await chargerParfums();

            } catch (error) {
                afficherMessage(error.message);
            }
        }

        chargerParfums().catch(error => afficherMessage(error.message));
    </script>

</body>
</html>
