<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Univers Parfum</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--bordure); overflow-x: auto; }
    .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: var(--texte-doux); border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--primaire); border-bottom-color: var(--primaire); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; box-shadow: var(--ombre); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f9f9f9; font-weight: bold; }
  </style>
</head>
<body>
  <header></header>
  <main class="container mt-4">
    <h1>Espace Administrateur</h1>
    
    <div class="tabs">
      <div class="tab active" data-target="tab-parfums">Parfums</div>
      <div class="tab" data-target="tab-users">Utilisateurs</div>
      <div class="tab" data-target="tab-litiges">Litiges</div>
    </div>

    <!-- Onglet Parfums -->
    <div id="tab-parfums" class="tab-content active">
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div class="form-card" style="flex: 1; min-width: 300px; margin: 0;">
          <h3>Ajouter un parfum</h3>
          <form id="form-parfum">
            <div class="form-group"><label>Référence</label><input type="text" id="ref" required></div>
            <div class="form-group"><label>Nom</label><input type="text" id="nom" required></div>
            <div class="form-group"><label>Marque</label><input type="text" id="marque" required></div>
            <div class="form-group"><label>Contenance (ml)</label><input type="number" id="ml" required value="50"></div>
            <div class="form-group"><label>Prix (€)</label><input type="number" step="0.01" id="prix" required></div>
            <div class="form-group"><label>Stock</label><input type="number" id="stock" required></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Créer</button>
          </form>
        </div>
        <div style="flex: 2; min-width: 300px;" id="liste-parfums"></div>
      </div>
    </div>

    <!-- Onglet Utilisateurs -->
    <div id="tab-users" class="tab-content">
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div class="form-card" style="flex: 1; min-width: 300px; margin: 0;">
          <h3>Créer un compte</h3>
          <form id="form-user">
            <div class="form-group"><label>Nom</label><input type="text" id="u-nom" required></div>
            <div class="form-group"><label>Prénom</label><input type="text" id="u-prenom" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="u-email" required></div>
            <div class="form-group">
              <label>Rôle</label>
              <select id="u-role"><option value="PREPARATEUR">Préparateur</option><option value="LIVREUR">Livreur</option></select>
            </div>
            <div class="form-group"><label>Téléphone</label><input type="text" id="u-tel"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Créer</button>
          </form>
        </div>
        <div style="flex: 2; min-width: 300px;" id="liste-users"></div>
      </div>
    </div>

    <!-- Onglet Litiges -->
    <div id="tab-litiges" class="tab-content">
      <div id="liste-litiges"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      injecterMenu("admin");
      const user = api.getUser();
      
      // SÉCURITÉ : Vérification du rôle Admin
      if (!user || (user.role !== "ADMIN" && user.role !== "ADMINISTRATEUR")) {
        window.location.href = "login.html";
        return;
      }

      // Gestion des onglets
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById(tab.dataset.target).classList.add('active');
        });
      });

      // Chargement des données
      async function chargerTout() {
        // Parfums
        try {
          const parfums = await api.getParfums();
          document.getElementById("liste-parfums").innerHTML = `<table><tr><th>Réf</th><th>Nom</th><th>Prix</th><th>Stock</th><th>Action</th></tr>
            ${parfums.map(p => `<tr><td>${p.reference}</td><td>${p.nom}</td><td>${formatPrix(p.prix)}</td><td>${p.stock_disponible}</td>
            <td><button class="btn btn-danger btn-sm" onclick="supprParfum('${p.reference}')">Suppr</button></td></tr>`).join("")}</table>`;
        } catch(e) { console.error(e); }

        // Utilisateurs
        try {
          const users = await api.getUtilisateurs();
          document.getElementById("liste-users").innerHTML = `<table><tr><th>Nom</th><th>Email</th><th>Rôle</th></tr>
            ${users.map(u => `<tr><td>${u.prenom} ${u.nom}</td><td>${u.email}</td><td><span class="badge" style="background:var(--primaire);color:white;">${u.role}</span></td></tr>`).join("")}</table>`;
        } catch(e) { document.getElementById("liste-users").innerHTML = "<p>Erreur API Utilisateurs</p>"; }

        // Litiges (Commandes en cours ou annulées)
        try {
          const commandes = await api.getCommandes();
          const litiges = commandes.filter(c => c.statut === 'EN_LIVRAISON' || c.statut === 'ANNULEE');
          document.getElementById("liste-litiges").innerHTML = `<table><tr><th>Commande</th><th>Statut</th><th>Action</th></tr>
            ${litiges.map(c => `<tr><td>#${c.id}</td><td>${c.statut}</td>
            <td>${c.statut !== 'ANNULEE' ? `<button class="btn btn-danger btn-sm" onclick="arbitrer(${c.id})">Arbitrer (Annuler)</button>` : '-'}</td></tr>`).join("")}</table>`;
        } catch(e) { console.error(e); }
      }

      chargerTout();

      // Formulaires
      document.getElementById("form-parfum").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await api.createParfum({
            reference: document.getElementById("ref").value,
            nom: document.getElementById("nom").value,
            marque: document.getElementById("marque").value,
            contenance_ml: parseInt(document.getElementById("ml").value),
            prix: parseFloat(document.getElementById("prix").value),
            stock_disponible: parseInt(document.getElementById("stock").value)
          });
          notifier("Parfum créé !", "success"); e.target.reset(); chargerTout();
        } catch (err) { notifier(err.message, "error"); }
      });

      document.getElementById("form-user").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await fetch("http://localhost:3000/api/admin/utilisateurs", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + localStorage.getItem("up_token") },
            body: JSON.stringify({
              nom: document.getElementById("u-nom").value,
              prenom: document.getElementById("u-prenom").value,
              email: document.getElementById("u-email").value,
              role: document.getElementById("u-role").value,
              telephone: document.getElementById("u-tel").value
            })
          });
          notifier("Utilisateur créé !", "success"); e.target.reset(); chargerTout();
        } catch (err) { notifier("Erreur de création", "error"); }
      });

      window.supprParfum = async (ref) => {
        if (!confirm("Supprimer ?")) return;
        try { await api.deleteParfum(ref); chargerTout(); } catch(e) { notifier(e.message, "error"); }
      };

      window.arbitrer = async (id) => {
        if (!confirm("Annuler cette commande ?")) return;
        try {
          await fetch(`http://localhost:3000/api/admin/commandes/${id}/arbitrer`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + localStorage.getItem("up_token") },
            body: JSON.stringify({ commentaire: "Annulé par l'administrateur." })
          });
          notifier("Commande annulée.", "success"); chargerTout();
        } catch(e) { notifier("Erreur", "error"); }
      };
    });
  </script>
</body>
</html>
