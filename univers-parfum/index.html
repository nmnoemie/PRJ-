<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univers Parfum - Accueil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header></header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>L'art de la parfumerie</h1>
        <p>Découvrez nos fragrances d'exception, créées pour révéler votre personnalité.</p>
        <a href="catalogue.html" class="btn btn-primary">Découvrir le catalogue</a>
      </div>
    </section>

    <section class="container mt-4">
      <h2>Nos parfums du moment</h2>
      <div id="parfums-vedettes" class="grid-parfums">
        <!-- Les cartes de parfums seront injectées ici par JS -->
        <p>Chargement des parfums...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Univers Parfum - Démonstration</p>
      <button id="btn-reset" class="btn btn-secondary btn-sm">Réinitialiser la démo</button>
    </div>
  </footer>

  <div id="toast" class="toast"></div>

  <!-- Chargement des scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  
  <script>
    // Initialisation de la page
    document.addEventListener("DOMContentLoaded", async () => {
      injecterMenu("index");

      // Gestion du bouton "Réinitialiser"
      document.getElementById("btn-reset").addEventListener("click", () => {
        localStorage.clear();
        window.location.reload();
      });

      // Charger les parfums
      try {
        const parfums = await api.getParfums();
        const container = document.getElementById("parfums-vedettes");
        
        // On n'affiche que les 4 premiers pour la page d'accueil
        const vedettes = parfums.slice(0, 4);
        
        if (vedettes.length === 0) {
          container.innerHTML = "<p>Aucun parfum en stock pour le moment.</p>";
          return;
        }

        container.innerHTML = vedettes.map(p => `
          <div class="carte-parfum">
            <div class="visuel" style="background: ${p.degrade || 'linear-gradient(135deg, #ccc, #eee)'}">
              ${p.stock_disponible === 0 ? '<span class="badge badge-rupture">Rupture</span>' : ''}
            </div>
            <div class="infos">
              <p class="marque">${p.marque}</p>
              <h3>${p.nom}</h3>
              <p class="prix">${formatPrix(p.prix)}</p>
              <a href="parfum.html?ref=${p.reference}" class="btn btn-secondary">Voir la fiche</a>
            </div>
          </div>
        `).join("");
      } catch (err) {
        console.error(err);
        notifier("Impossible de charger les parfums.", "error");
      }
    });
  </script>
</body>
</html>
