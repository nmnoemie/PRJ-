<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - Univers Parfum</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header></header>

  <main class="container mt-4">
    <div class="form-card">
      <h2>Connexion</h2>
      <form id="form-login">
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" required placeholder="client@parfum.test">
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" required placeholder="Test1234!">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
      </form>

      <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
        <p>Pas encore de compte ? <a href="register.html">S'inscrire</a></p>
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--bordure);">
        <p style="margin-bottom: 10px;">Accès rapide (démo) :</p>
        <div style="display: flex; gap: 5px; justify-content: center; flex-wrap: wrap;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="remplir('client@parfum.test')">Client</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="remplir('prepa@parfum.test')">Préparateur</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="remplir('livreur@parfum.test')">Livreur</button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="remplir('admin@parfum.test')">Admin</button>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      injecterMenu("login");

      window.remplir = (email) => {
        document.getElementById("email").value = email;
        document.getElementById("password").value = "Test1234!";
      };

      document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const data = await api.login(email, password);
          notifier("Connexion réussie !", "success");
          
          // Redirection basée sur le rôle (sécurisé côté client)
          const role = data.role || (data.user && data.user.role);
          if (role === "ADMINISTRATEUR" || role === "ADMIN") window.location.href = "admin.html";
          else if (role === "PREPARATEUR") window.location.href = "preparation.html";
          else if (role === "LIVREUR") window.location.href = "livraison.html";
          else window.location.href = "index.html"; // Client par défaut
          
        } catch (err) {
          notifier(err.message || "Email ou mot de passe incorrect.", "error");
        }
      });
    });
  </script>
</body>
</html>
